name: Dependabot auto-merge

# Queues GitHub auto-merge on Dependabot patch/minor PRs. The merge only
# happens after the required `validate` check (ci.yml) passes, enforced by
# the "main: require CI" ruleset. Framework packages and major bumps are
# left for human review.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >-
          steps.meta.outputs.dependency-group != 'frameworks' &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
